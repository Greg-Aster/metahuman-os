apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'
def mobileVersionCode = (System.getenv("METAHUMAN_MOBILE_APP_VERSION_CODE") ?: "1").toInteger()
def mobileVersionName = System.getenv("METAHUMAN_MOBILE_APP_VERSION") ?: "1.0.0"
def releaseKeystorePath = System.getenv("METAHUMAN_ANDROID_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("METAHUMAN_ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("METAHUMAN_ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("METAHUMAN_ANDROID_KEY_PASSWORD")
def releaseSigningConfigured = [
    releaseKeystorePath,
    releaseKeystorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { it }

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.metahumanrn"
    defaultConfig {
        applicationId "com.metahumanrn"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode mobileVersionCode
        versionName mobileVersionName

        // nodejs-mobile-react-native doesn't include x86 (32-bit) binaries
        // Only build for architectures with prebuilt libnode.so
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
